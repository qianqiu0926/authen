server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/authen.classby.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/authen.classby.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_name authen.classby.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/authen-acme; }
    location = / { return 302 /authen/; }
    include /etc/nginx/snippets/authen-prefix.conf;
    location /api/ {
        limit_req zone=authen_api_rate burst=10 nodelay;
        limit_req_status 429;
        limit_conn authen_connections 5;
        proxy_pass http://127.0.0.1:14173;
        include /etc/nginx/snippets/authen-proxy.conf;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name authen.classby.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/authen-acme; }
    location / { return 301 https://authen.classby.cn$request_uri; }
}
